services:
  db:
    # イメージは Docker Hub の公開ミラー（Google 運営）から取得する。中身は Docker Hub と同一。
    # クラウド環境から Docker Hub の配信元が遮断されているため（詳細は docs/docker-compose.md）。
    # バージョンはパッチまで固定する（浮動タグだと予告なく中身が変わり起動不能になるため）。
    image: mirror.gcr.io/library/postgres:16.13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mahjong_score_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    # Ruby のバージョンは .ruby-version / Gemfile / ci.yml と揃える（不一致だと bundler が停止する）。
    image: mirror.gcr.io/library/ruby:3.3.10
    depends_on:
      - db
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: ${RAILS_ENV:-development}
      DATABASE_HOST: ${DATABASE_HOST:-db}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-password}
      DATABASE_NAME: ${DATABASE_NAME:-mahjong_score_development}
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:-}
    command: bash -lc "bundle install && bin/rails s -b 0.0.0.0"

  playwright:
    image: mcr.microsoft.com/playwright:v1.59.1-noble
    depends_on:
      - web
    working_dir: /app
    volumes:
      - .:/app
    environment:
      BASE_URL: http://web:3000
    # frontend サービスは compose に無いため MPA 版だけ流す（両版は docs/commands.md の手順で）
    command: bash -lc "npm ci && npx playwright test --project mpa"
    profiles:
      - e2e

volumes:
  postgres_data:
